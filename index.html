<style>
/* Layout: one phone-width column. Hero figure first, then four tiles, 7-day chart, things needing attention.
   Bottom tab bar, gold "Sell" button always within thumb reach, forms open as bottom sheets. */
:root{
  --bg:#F0F3EE; --surface:#FFFFFF; --ink:#13231A; --muted:#5B6D62; --line:#DCE3DA;
  --brand:#0B5D3B; --on-brand:#FFFFFF; --brand-soft:#DDEBDF;
  --hero:#0B4A31; --hero-ink:#FFFFFF; --hero-dim:#B9D6C5;
  --gold:#F5B700; --on-gold:#2B2000;
  --red:#BE3A2C; --red-soft:#F7E0DB; --amber:#9A6200; --amber-soft:#FBEBC6; --ok:#17794A; --ok-soft:#D7EEDF;
  --bar:#BCD3C3; --shadow:0 1px 2px rgba(19,35,26,.06),0 6px 20px rgba(19,35,26,.06);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif; --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1410; --surface:#13201A; --ink:#E8F0EA; --muted:#8FA397; --line:#243529;
  --brand:#4CC38A; --on-brand:#05210F; --brand-soft:#1B3328;
  --hero:#0F4B31; --hero-ink:#FFFFFF; --hero-dim:#A9CDB9;
  --gold:#F5B700; --on-gold:#2B2000;
  --red:#F0806F; --red-soft:#3A1D19; --amber:#F0BE55; --amber-soft:#3A2D0E; --ok:#5ED397; --ok-soft:#173226;
  --bar:#2C4637; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1410; --surface:#13201A; --ink:#E8F0EA; --muted:#8FA397; --line:#243529;
  --brand:#4CC38A; --on-brand:#05210F; --brand-soft:#1B3328;
  --hero:#0F4B31; --hero-ink:#FFFFFF; --hero-dim:#A9CDB9;
  --gold:#F5B700; --on-gold:#2B2000;
  --red:#F0806F; --red-soft:#3A1D19; --amber:#F0BE55; --amber-soft:#3A2D0E; --ok:#5ED397; --ok-soft:#173226;
  --bar:#2C4637; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:14px 150px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}

.logo.ph{background-size:cover;background-position:center;background-repeat:no-repeat;color:transparent;font-size:0}
.logo{width:42px;height:42px;border-radius:12px;background:var(--hero);color:var(--gold);display:grid;place-items:center;font:800 17px var(--f-display);flex:none;letter-spacing:-.04em}
.top .who{min-width:0;flex:1}
.top .who small{display:block;color:var(--muted);font-size:13px}
.top .who b{display:block;font:700 18px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn{position:relative}.nbadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font:800 11px/18px var(--f-body);text-align:center}
.nrow{display:block;padding:12px 0;border-bottom:1px solid var(--line)}.nrow.new{background:var(--amber-soft);margin:0 -14px;padding:12px 14px;border-radius:12px;border-bottom:0;margin-bottom:6px}.nrow b{display:block}.nrow small{color:var(--muted)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:20px 18px 18px;
  background-image:radial-gradient(circle at 100% 0,rgba(245,183,0,.28) 0 70px,transparent 71px),
  radial-gradient(circle at 100% 0,transparent 0 92px,rgba(255,255,255,.07) 93px 94px,transparent 95px),
  radial-gradient(circle at 100% 0,transparent 0 118px,rgba(255,255,255,.06) 119px 120px,transparent 121px)}
.hero .lbl{font-size:13px;color:var(--hero-dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hero .big{font:800 clamp(38px,12vw,52px)/1.05 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:6px 0 4px}
.hero .sub{color:var(--hero-dim);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.delta{font-weight:700;padding:2px 8px;border-radius:99px;font-size:12.5px}
.delta.up{background:rgba(94,211,151,.2);color:#9BF0C4}.delta.down{background:rgba(240,128,111,.2);color:#FFB4A8}
.hero .profit{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.16);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hero .profit b{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.hero .profit span{font-size:13px;color:var(--hero-dim)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.tile-s{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-s small{color:var(--muted);font-size:12.5px;font-weight:600}
.tile-s b{font:700 19px var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.tile-s.warn b{color:var(--red)} .tile-s.low b{color:var(--amber)}
.tile-s em{font-style:normal;font-size:12px;color:var(--muted)}

.sect{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px}
.sect h2{font-size:17px}.sect a,.sect button{color:var(--brand);font-weight:700;font-size:14px}
.chart svg{width:100%;height:auto;display:block}
.chart .b{fill:var(--bar)} .chart .b.t{fill:var(--brand)} .chart text{fill:var(--muted);font:600 11px var(--f-body)} .chart text.v{fill:var(--ink);font:700 11.5px var(--f-body)}
.chart .g{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.note{color:var(--muted);font-size:13.5px}
.insight{font-size:14px;color:var(--muted);margin:8px 2px 0}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-width:0}
.row:last-child{border-bottom:0}
button.row:active{background:var(--brand-soft)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;flex:none}
.row .r b{font:700 16px var(--f-display);font-variant-numeric:tabular-nums}
.av{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font:700 16px var(--f-display);flex:none}
.av.red{background:var(--red-soft);color:var(--red)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)}.pill.amber{background:var(--amber-soft);color:var(--amber)}.pill.ok{background:var(--ok-soft);color:var(--ok)}
.dayh{display:flex;justify-content:space-between;margin:16px 4px 6px;font-weight:700;font-size:13.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.empty{padding:26px 16px;text-align:center;color:var(--muted)}

/* buttons & fields */
.lockscr{position:fixed;inset:0;z-index:1000;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;overflow-y:auto}
.lockscr[hidden]{display:none}
.lockscr h2{font:800 22px var(--f-display);text-align:center}
.lockscr .sub{color:var(--muted);text-align:center;max-width:300px}
.lockscr .dots{display:flex;gap:14px;margin:6px 0}
.lockscr .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand)}
.lockscr .dots i.on{background:var(--brand)}
.lockscr .pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin-top:4px}
.lockscr .pad button{height:66px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);font:700 24px var(--f-body);color:var(--ink)}
.lockscr .pad button.x{background:transparent;border-color:transparent;font-size:20px}
.lockscr .msg{min-height:22px;color:var(--red);font-weight:700;text-align:center;max-width:300px}
.lockscr .lk{color:var(--muted);text-decoration:underline;font-weight:600;padding:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--surface);border:1.5px solid var(--line)}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.danger{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;border-radius:10px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px;flex-wrap:wrap}.btns>*{flex:1 1 140px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;width:100%}
.field textarea{min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--brand-soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{min-height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.search{position:relative;margin-bottom:12px}
.search input{width:100%;min-height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px}
.search input:focus{outline:none;border-color:var(--brand)}

/* Shop Brain */
.brain{background:var(--brand-soft);border-radius:18px;padding:14px;margin:6px 0 4px;display:flex;flex-direction:column;gap:10px}
.brain-h{display:flex;align-items:center;gap:10px}
.brain-h h2{font-size:18px}.brain-h small{color:var(--muted);font-size:13px}
.brain-ic{width:38px;height:38px;border-radius:12px;background:var(--hero);color:var(--gold);display:grid;place-items:center;flex:none}
.brain-ic svg{width:20px;height:20px}
.bi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bi h3{font-size:16px;line-height:1.25}
.bi p{margin:0;font-size:14px}
.bi .fig{font-weight:700;font-variant-numeric:tabular-nums}
.bi .next{color:var(--muted)}.bi .next b{color:var(--ink)}
.bi-top{display:flex;justify-content:space-between;align-items:center;width:100%}
.bi-x{font-size:13px;font-weight:600;color:var(--muted);min-height:36px;padding:0 6px;text-decoration:underline}
.bi .btn{margin-top:2px}
.bi-hid{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}.bi-hid .m{min-width:0}
.brain-gap{margin:0;font-size:13px;color:var(--muted)}.brain-gap b{color:var(--ink)}
.brain-tg{align-self:flex-start;font-size:13.5px;font-weight:700;color:var(--brand);min-height:36px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:12px}
.nav button.on{color:var(--brand)}
.nav button.on svg{stroke-width:2.4}
.fab{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:8px;height:54px;padding:0 22px 0 18px;border-radius:99px;background:var(--gold);color:var(--on-gold);font:800 16px var(--f-display);
  box-shadow:0 6px 18px rgba(0,0,0,.28)}
.fab svg{width:24px;height:24px;stroke-width:2.6}

/* sheet */
.ov{position:fixed;inset:0;z-index:40;background:rgba(5,15,10,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92dvh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) 6px}
.sheet-head h2{font-size:20px}
.x{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:15px}
.sheet-body{overflow:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 18px;flex:1;overscroll-behavior:contain}
.sheet-foot{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:center}
.sheet-foot .tot{flex:1;min-width:0}.sheet-foot .tot small{display:block;color:var(--muted);font-size:12.5px}.sheet-foot .tot b{font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{position:relative}
.pimg{width:44px;height:44px;border-radius:10px;background:var(--line) center/cover no-repeat;flex:none}
.tpic{width:48px;height:48px;border-radius:10px;background:var(--line) center/cover no-repeat;margin-bottom:4px}
.ppick{display:flex;gap:12px;align-items:center;margin:2px 0 14px}.ppick .pimg{width:64px;height:64px;border-radius:14px}
.tmain{width:100%;min-height:88px;text-align:left;padding:12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px}
.tile.sel .tmain{border-color:var(--brand);background:var(--brand-soft)}
.tile.out .tmain{opacity:.55}
.tn{font-weight:700;line-height:1.2;padding-right:30px;overflow-wrap:anywhere}.tp{font:700 15px var(--f-display);color:var(--brand)}.ts{font-size:12.5px;color:var(--muted)}
.badge{position:absolute;top:8px;right:8px;min-width:26px;height:26px;border-radius:99px;background:var(--brand);color:var(--on-brand);font:800 13px/26px var(--f-display);text-align:center;padding:0 6px;pointer-events:none}
.tminus{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--surface);border:1.5px solid var(--brand);color:var(--brand);font:800 18px/1 var(--f-display)}
.ln{display:grid;grid-template-columns:1fr auto 78px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ln small{display:block;color:var(--muted);font-size:12.5px}
.ln .lt{text-align:right;font:700 15px var(--f-display);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:2px}.step button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:800 17px var(--f-display)}
.step span{min-width:26px;text-align:center;font-weight:700}
.sumline{display:flex;justify-content:space-between;padding:6px 0}
.ok-ring{width:84px;height:84px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:8px auto 10px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.ok-ring svg{width:44px;height:44px;stroke-width:3}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.receipt{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:14px;font:13.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0}
.center{text-align:center}
.banner{display:flex;gap:10px;align-items:center;background:var(--amber-soft);color:var(--amber);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;font-weight:600}
.banner span{flex:1}.banner button{font-weight:800;text-decoration:underline;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--brand-soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14px;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
a.btn{text-decoration:none;color:inherit}a.btn.primary{color:var(--on-brand)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<nav class="nav" aria-label="Main"><div id="nav"></div></nav>

<div class="toast" id="toast" hidden></div>

const csvEsc=v=>{let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s)&&isNaN(Number(s)))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};

function csvParse(txt){
  txt=String(txt||'').replace(/^\uFEFF/,'');const first=txt.split(/\r?\n/)[0]||'';
  const cnt=ch=>first.split(ch).length-1,del=cnt('\t')>cnt(',')&&cnt('\t')>=cnt(';')?'\t':cnt(';')>cnt(',')?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===del){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''))}

function csvCols(head,kind){const m={},H=head.map(x=>String(x).trim().toLowerCase());
  Object.keys(HDR).forEach(k=>{if(kind==='customers'&&['price','cost','qty','low','code'].indexOf(k)>=0)return;const i=H.findIndex((x,ix)=>HDR[k].indexOf(x)>=0&&Object.values(m).indexOf(ix)<0);if(i>=0)m[k]=i});return m}
function csvPlan(txt,kind){
  const rows=csvParse(txt);if(rows.length<2)return {err:'The file has no rows to add. The first row must be the column names.'};
  if(rows.length>2001)return {err:'That file has more than 2000 rows. Please split it into smaller files.'};
  const col=csvCols(rows[0],kind);if(col.name==null)return {err:'I could not find a column called Name. The first row must have the column names.'};
  if(kind==='items'&&col.price==null)return {err:'I could not find a column called Price (or Selling price).'};
  const get=(r,k)=>col[k]==null?'':String(r[col[k]]==null?'':r[col[k]]).trim();
  const out={kind,add:[],upd:[],skip:[],cols:col},seen={};
  rows.slice(1).forEach((r,ix)=>{const line=ix+2,name=get(r,'name').slice(0,60);if(!name){out.skip.push('Row '+line+': no name');return}
    const key=name.toLowerCase();if(seen[key]){out.skip.push('Row '+line+': '+name+' is listed twice');return}seen[key]=1;
    if(kind==='customers'){const ph=get(r,'phone').replace(/[^0-9+]/g,'').slice(0,20),ex=S.customers.find(c=>c.name.trim().toLowerCase()===key);
      if(ex){if(ph&&!ex.phone)out.upd.push({id:ex.id,name:ex.name,phone:ph});else out.skip.push('Row '+line+': '+name+' is already in your customers');return}
      out.add.push({name,phone:ph});return}
    const price=num(get(r,'price'));if(!price){out.skip.push('Row '+line+': '+name+' has no selling price');return}
    const o={name,price,cost:col.cost==null?null:num(get(r,'cost')),qty:col.qty==null?0:Math.round(num(get(r,'qty'))),low:col.low==null?null:Math.round(num(get(r,'low'))),code:col.code==null?'':bcNorm(get(r,'code'))};
    const ex=(o.code&&S.products.find(p=>p.code&&bcNorm(p.code)===o.code))||S.products.find(p=>p.name.trim().toLowerCase()===key);
    if(o.code&&out.add.some(a=>a.code===o.code)){o.code=''}
    if(ex){o.id=ex.id;if(o.code&&S.products.some(p=>p.id!==ex.id&&p.code&&bcNorm(p.code)===o.code))o.code='';out.upd.push(o)}
    else{if(o.code&&S.products.some(p=>p.code&&bcNorm(p.code)===o.code))o.code='';out.add.push(o)}});
  return out}

/* ---------- calculations ---------- */
const bal=cid=>sum(S.ledger.filter(l=>l.cid===cid),l=>l.amount);
const cust=id=>S.customers.find(c=>c.id===id);
const inR=(t,a,b)=>t>=a&&t<b;
function bounds(r){const t=sod(Date.now());if(r==='today')return[t,t+DAY];if(r==='week')return[t-6*DAY,t+DAY];const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return[d.getTime(),t+DAY]}
function stats(a,b){
  const sales=S.sales.filter(s=>inR(s.ts,a,b)),exp=S.expenses.filter(e=>inR(e.ts,a,b));
  const rets=(S.moves||[]).filter(m=>m.type==='customer-return'&&inR(m.ts,a,b)),ret=sum(rets,m=>Math.abs(m.qty)*(m.price||0)),retCost=sum(rets,m=>Math.abs(m.qty)*(m.cost||0)),refunded=sum(rets,m=>m.refund||0);
  const salesTotal=sum(sales,s=>s.total),total=salesTotal-ret,cogs=sum(sales,s=>sum(s.items,i=>i.cost*i.qty))-retCost,spent=sum(exp.filter(e=>e.cat!=='Restock'),e=>e.amount),bought=sum(exp.filter(e=>e.cat==='Restock'),e=>e.amount);
  const repaid=sum(S.ledger.filter(l=>l.kind==='payment'&&inR(l.ts,a,b)),l=>-l.amount);
  const lost=sum((S.moves||[]).filter(m=>LOSS.includes(m.type)&&inR(m.ts,a,b)),m=>Math.abs(m.qty)*(m.cost||0));
  return{sales,exp,total,salesTotal,ret,rets,refunded,cogs,spent,bought,lost,gross:total-cogs,profit:total-cogs-spent-lost,count:sales.length,received:sum(sales,s=>s.paid)+repaid-refunded,repaid};
}
/* Profit is only called reliable when every sold item has a cost price and some spending has been recorded. */
function profitCheck(T){
  const noCost=T.sales.some(s=>s.items.some(i=>!(i.cost>0))),noExp=S.expenses.length===0;
  const why=[];if(noCost)why.push('some items have no cost price');if(noExp)why.push('no spending recorded yet');
  return{ok:!T.sales.length||(!noCost&&!noExp),noCost,noExp,why:why.join(' and ')};

/* Agreed pay date: only customers who owe money and have a date set. days>0 means that many days overdue; days<0 means due in that many days. */
const dueInfo=(c,now)=>{if(!(bal(c.id)>0)||!c.due)return null;const d=Math.round((sod(now||Date.now())-sod(c.due))/DAY);return{days:d,over:d>0,today:d===0}};
/* An agreed pay date only means something while the customer owes money. */
function fixDue(){if(S&&Array.isArray(S.customers))S.customers.forEach(c=>{if(c.due&&!(bal(c.id)>0))c.due=0})}
const debtors=()=>S.customers.map(c=>({c,b:bal(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
/* Fast and slow movers: units sold per item over up to 30 days. 'Not moving' needs 14+ days of history and ignores items added in the last 14 days. */
function movers(now){
  now=now||Date.now();if(!S.sales.length)return null;
  const t0=sod(now),first=Math.min.apply(null,S.sales.map(s=>s.ts)),win=Math.min(30,Math.round((t0-sod(first))/DAY)+1),from=t0-(win-1)*DAY,use={};
  S.sales.filter(s=>s.ts>=from&&s.ts<=now).forEach(s=>s.items.forEach(i=>{if(i.pid)use[i.pid]=(use[i.pid]||0)+i.qty}));
  const fast=S.products.filter(p=>use[p.id]>0).sort((a,b)=>use[b.id]-use[a.id]).slice(0,3).map(p=>({p,u:use[p.id]}));
  const newest=p=>Math.max.apply(null,[p.added||0].concat((S.moves||[]).filter(m=>m.pid===p.id&&(m.type==='opening'||m.type==='purchase')).map(m=>m.ts)));
  const slow=win<14?[]:S.products.filter(p=>p.qty>0&&!use[p.id]&&newest(p)<t0-13*DAY).map(p=>({p,v:p.qty*p.cost})).sort((a,b)=>b.v-a.v);
  return{win,fast,slow,enough:win>=14};
}

/* ---------- Shop Brain ----------
   Reads the shop's existing records (products, sales, ledger, expenses) and returns advice.
   It never creates sales, changes stock, edits debts or sends messages. Buttons only open existing screens. */
const Brain=(function(){
  const thr=lowOf;
  const pl=(n,a,b)=>n===1?a:b;
  const names=(arr,max,f)=>{const s=arr.slice(0,max).map(f||(x=>x));return s.join(', ')+(arr.length>max?' and '+(arr.length-max)+' more':'')};
  const dayDiff=(a,b)=>Math.round((sod(a)-sod(b))/DAY);

  const mk=(o)=>Object.assign({tone:''},o);

  /* 1. Records that make reports unreliable */
  function ruleRecords(c){
    const out=[];
    const neg=S.products.filter(p=>p.qty<0);
    const over=S.customers.filter(x=>bal(x.id)<0);
    const known=new Set(S.customers.map(x=>x.id));

    const rec={};S.ledger.forEach(l=>{if(l.saleId)rec[l.saleId]=(rec[l.saleId]||0)+l.amount});
    const mism=S.sales.filter(s=>s.paid>s.total||Math.abs((rec[s.id]||0)-Math.max(s.total-s.paid,0))>0.5);
    const parts=[];
    if(neg.length)parts.push(neg.length+' '+pl(neg.length,'item shows','items show')+' negative stock');
    if(mism.length)parts.push(mism.length+' '+pl(mism.length,'sale has','sales have')+' a debt that does not match its payment');
    if(orphan.length)parts.push(orphan.length+' debt '+pl(orphan.length,'entry belongs','entries belong')+' to a missing customer');
    if(parts.length){
      const dest=neg.length?{tab:'stock',f:'all'}:mism.length?{tab:'sales'}:{tab:'debts'};
      const fig=neg.length?names(neg,3,p=>p.name+' ('+p.qty+')'):mism.length?'Sale #'+mism[0].no:orphan.length+' debt '+pl(orphan.length,'entry','entries')+' without a customer';
      out.push(mk({id:'records-integrity',cat:'Records',tone:'red',prio:90,
        title:'Some records do not add up',
        body:parts.join('. ')+'. Your reports may be wrong until this is corrected.',
        fig:fig,next:'Open the record and correct it.',cta:neg.length?'View stock':mism.length?'View sales':'Review debts',dest:dest,
        sig:[neg.length,mism.length,orphan.length].join('|')}));

    if(over.length){
      out.push(mk({id:'records-credit',cat:'Debts',tone:'amber',prio:52,
        title:over.length+' '+pl(over.length,'customer has','customers have')+' a credit balance',
        body:'They have paid more than their recorded debt. This can happen after a sale is cancelled. Check the amount before you rely on the debt totals.',
        fig:names(over,3,x=>x.name+' ('+N(-bal(x.id))+' credit)'),next:'Open the customer and check their history.',cta:'Review debts',dest:{tab:'debts'},
        sig:over.map(x=>x.id+':'+Math.round(bal(x.id))).sort().join(',')}));

        title:below.length+' '+pl(below.length,'item is','items are')+' priced below what you paid',
        body:'Every sale of these items loses money. Check that the cost price and selling price were typed correctly.',
        fig:names(below,3,p=>p.name+' (cost '+N(p.cost)+', price '+N(p.price)+')'),next:'Correct the price, or the cost, in Stock.',cta:'Fix in stock',dest:{tab:'stock',f:'all'},
        sig:below.map(p=>p.id+':'+p.cost+':'+p.price).sort().join(',')}));

  }

  /* 2. Low or finished stock, using each item's own warning number */
  function ruleLow(c){
    const low=S.products.filter(p=>!p.nt&&p.qty<=thr(p)).sort((a,b)=>a.qty-b.qty);
    if(!low.length)return{};

      title:fin?fin+' '+pl(fin,'item is','items are')+' finished':low.length+' '+pl(low.length,'item is','items are')+' running low',

  /* 3. Debts. No due dates are stored, so nothing is called overdue. */
  function ruleDebts(c){

      fig:worst.x.c.name+' owes '+N(worst.x.b)+', '+worst.days+' '+pl(worst.days,'day','days')+(worst.paid?' since the last payment':' since the debt began'),
      next:'Send a WhatsApp reminder, starting with the biggest balances.',cta:'Review debts',dest:{tab:'debts'},

  /* Money tied up in stock that has not sold */

      fig:m.slow[0].p.name+': '+m.slow[0].p.qty+' left, '+N(m.slow[0].v)+' at cost',

  /* 4. Today so far against the same hours yesterday */

  /* 5. Profit, using the same calculation as Home and Money (stats) */
  function ruleProfit(c){

        cta:noCost?'Fix costs':'Record spending',dest:noCost?{tab:'stock',f:'all'}:{tab:'money',m:'expenses'},
        sig:label+'|'+(noCost?1:0)+(noExp?1:0)+'|'+c.t0})]};
    }

  /* 6. Days of stock left. Needs real sales history, always labelled an estimate. */
  function ruleRestock(c){

        title:'Staff sales today: '+N(tot),

        fig:names(rows,3,k=>k+': '+g[k].n+' '+pl(g[k].n,'sale','sales')+', '+N(g[k].t)),
        next:'Check this against the cash and transfers your staff hand over.',cta:'View sales',dest:{tab:'sales'},
        sig:rows.map(k=>k+g[k].n+':'+g[k].t).join('|')+'|'+T}));
    }

    if(ex.length){
      const tot=ex.reduce((a,e)=>a+e.amount,0);

        title:'Staff recorded spending today: '+N(tot),
        body:'This lowers the profit you see. Make sure the money was really spent.',
        fig:names(ex,3,e=>N(e.amount)+' '+e.cat+' ('+e.by+')'),next:'Ask for the receipt or an explanation if it looks wrong.',cta:'View spending',dest:{tab:'money',m:'spend'},
        sig:ex.map(e=>e.id).join(',')}));

  }

})();

function pasteParse(txt){
  const seen={},out=[];
  String(txt||'').split(/\r?\n/).slice(0,500).forEach(raw=>{
    let l=raw.replace(/^\s*(?:\d{1,3}\s*[.)]|[-*•])\s+/,'').replace(/₦/g,' ').replace(/(\d),(\d{3})(?!\d)/g,'$1$2').replace(/\s+[x×*]\s+/gi,' ').replace(/[;:=\t|]+/g,' ').replace(/,/g,' ').trim();
    if(!l)return;
    const t=l.split(/\s+/),nums=[];
    while(t.length>1&&nums.length<2&&/^[Nn]?\d+(\.\d+)?$/.test(t[t.length-1]))nums.unshift(+t.pop().replace(/^[Nn]/,''));
    const name=t.join(' ').replace(/[-–—]+$/,'').trim().slice(0,60);
    if(!name||/^\d+(\.\d+)?$/.test(name))return;
    const price=nums.length?Math.min(nums[0],1e8):0,qty=nums.length>1?Math.min(Math.round(nums[1]),1e5):null,k=name.toLowerCase();
    const dup=!!seen[k]||S.products.some(x=>x.name.trim().toLowerCase()===k);seen[k]=1;
    out.push({name,price,qty,dup});
  });
  return out}

function renderSheet(){

/* ---------- Account storage ----------
   Records are always saved on this device first (localStorage, plus SharedPreferences in the Android app).
   When the page runs inside claude.ai and the viewer is signed in, the same records are also copied to that viewer's
   own private area of the platform database (data/users/<id>/shop). Each account therefore has its own shop, and the
   copy survives cleared browser data and a switch of device. Sample data is never copied. At start-up the copy is only
   used to fill in an empty or sample screen, or when it is newer than the device copy (the older one is kept aside). */
const Cloud={ready:false,st:'off',at:0,err:'',db:null,uid:null,gen:null,n:0,busy:false,dirty:false,timer:null,CH:60000};
const hasData=o=>!!o&&(o.products.length||o.sales.length||o.customers.length||o.expenses.length||o.ledger.length)>0;
function cloudText(){
  if(Cloud.st==='on')return Cloud.at?'Also backed up to your account at '+tm(Cloud.at)+'. It will be there if this phone or browser is cleared.':'Account backup is on. It will update after your next change.';
  if(Cloud.st==='busy')return 'Saving to your account…';
  if(Cloud.st==='error')return 'Account backup '+(Cloud.ready?'failed':'could not start')+' ('+Cloud.err+'). Your records are still saved on this device. '+(Cloud.ready?'It will try again after your next change.':'Close and reopen the app to try again.');
  if(Cloud.st==='checking')return 'Checking your account…';
  return 'Account backup is not available here, so records are saved on this device only. Open the page inside Claude while signed in to turn it on.';
}
function cloudShow(){const e=document.getElementById('cloudSt');if(e)e.textContent=cloudText()}
const cRef=()=>Cloud.db.doc('data/users/'+Cloud.uid+'/shop');
async function cloudPull(){
  const m=await cRef().get();if(!m.exists)return null;
  const d=m.data();let txt='';
  for(let i=0;i<d.parts;i++){const x=await cRef().collection('parts').doc(d.gen+'_'+i).get();if(!x.exists)throw {code:'incomplete'};txt+=x.data().t}
  const o=JSON.parse(txt);if(!o||!Array.isArray(o.products))throw {code:'unreadable'};
  Cloud.gen=d.gen;Cloud.n=d.parts;return {o,savedAt:+d.savedAt||0};
}
async function cloudPush(){
  if(!Cloud.db||!S||S.sample||ui.realStash)return;
  if(Cloud.busy){Cloud.dirty=true;return}
  Cloud.busy=true;Cloud.dirty=false;Cloud.st='busy';cloudShow();
  try{
    const txt=JSON.stringify(S),gen=Date.now().toString(36),n=Math.ceil(txt.length/Cloud.CH)||1,parts=cRef().collection('parts');
    for(let i=0;i<n;i++)await parts.doc(gen+'_'+i).set({t:txt.slice(i*Cloud.CH,(i+1)*Cloud.CH)});
    await cRef().set({v:1,gen,parts:n,savedAt:S.savedAt||Date.now(),shop:S.shop.name});
    const og=Cloud.gen,on=Cloud.n;Cloud.gen=gen;Cloud.n=n;
    if(og&&og!==gen)for(let i=0;i<on;i++){try{await parts.doc(og+'_'+i).delete()}catch(e){}}
    Cloud.st='on';Cloud.at=Date.now();Cloud.err='';
  }catch(e){Cloud.st='error';Cloud.err=(e&&e.code)||'unknown'}
  Cloud.busy=false;cloudShow();
  if(Cloud.dirty)cloudPush();
}
function cloudSched(){if(!Cloud.ready||!Cloud.db||!S||S.sample)return;clearTimeout(Cloud.timer);Cloud.timer=setTimeout(cloudPush,1200)}
const _save=save;
const _load=load;load=function(){return isStaff()?loadMirror():_load()};
save=function(){if(isStaff())return saveMirror();if(S&&!S.sample){fixDue();S.savedAt=Date.now()}const ok=_save();if(ok){cloudSched();syncSched();bkSched()}return ok};
function adopt(o){
  if(ui.realStash)ui.realStash=o;else S=o;
  try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}
  try{if(window.Android&&Android.save)Android.save(JSON.stringify(o))}catch(e){}
}
async function cloudInit(){
  try{
    if(typeof claude==='undefined'||!claude.use)return;
    Cloud.st='checking';
    const user=await claude.use('user'),db=await claude.use('db');
    if(!user||!db||!user.id){Cloud.st='off';return}
    const id=await user.id();if(!id){Cloud.st='off';return}
    Cloud.db=db;Cloud.uid=id;
    const r=await cloudPull();
    const real=ui.realStash||(S&&!S.sample?S:null);
    let note='';
    if(!r){ if(hasData(real))await cloudPush(); else Cloud.st='on' }
    else if(ui.userCleared){ Cloud.st='on' }
    else if(!hasData(real)){ adopt(norm(r.o));Cloud.at=r.savedAt;Cloud.st='on';note='Your saved records were found in your account' }
    else if(JSON.stringify(real)===JSON.stringify(r.o)||(real.savedAt||0)>=r.savedAt){ Cloud.at=r.savedAt;Cloud.st='on'; if((real.savedAt||0)>r.savedAt)await cloudPush() }
    else { try{localStorage.setItem(KEY+'.replaced-by-account',JSON.stringify(real))}catch(e){} adopt(norm(r.o));Cloud.at=r.savedAt;Cloud.st='on';note='Newer records from your account were loaded. Your earlier copy on this device is kept aside' }
    Cloud.ready=true;render();if(note)toast(note);
  }catch(e){Cloud.st='error';Cloud.err=(e&&e.code)||'unknown';cloudShow()}

  const pull=async(coll,map,since)=>{const docs=since?await fsQueryF(base,coll,[['updatedAt','GREATER_THAN_OR_EQUAL',{timestampValue:since}]],1000):await fsList(base+'/'+coll);docs.forEach(d=>{map[d._id]=d})};
  await pull('catalog',c.cat,c.tc);await pull('people',c.ppl,c.tp);
  c.tc=scMax(c.cat);c.tp=scMax(c.ppl);
  if(!c.ready){(await fsQuery(base,'subs','by',uid,300)).forEach(s=>{c.subs[s._id]=scSlim(s)});c.ready=true}
  else{
    const nw=await fsQueryF(base,'subs',[['by','EQUAL',{stringValue:uid}],['status','EQUAL',{stringValue:'new'}]],300),seen={};
    nw.forEach(s=>{seen[s._id]=1;c.subs[s._id]=scSlim(s)});
    for(const id of Object.keys(c.subs)){if(c.subs[id].status==='new'&&!seen[id]){const s=await fsGet(base+'/subs/'+id);if(s)c.subs[id]=scSlim(Object.assign({_id:id},s))}}}
  const ids=Object.keys(c.subs);
  if(ids.length>300){ids.filter(i=>c.subs[i].status!=='new').sort((a,b)=>(c.subs[a].ts||0)-(c.subs[b].ts||0)).slice(0,ids.length-300).forEach(i=>{delete c.subs[i]})}
  try{localStorage.setItem(SCK,JSON.stringify(c))}catch(e){}
  return [Object.values(c.cat),Object.values(c.ppl),Object.values(c.subs)]}

function applySub(sub){

    const nm=String(b.name||'').trim().slice(0,60),id=String(b.cid||'');
    if(!nm)return {rej:'No name'};if(!/^[a-z0-9]{4,40}$/.test(id))return {rej:'Bad customer id'};
    if(S.customers.some(x=>x.id===id))return {ok:1,dup:1,kind:'cust',nm};
    S.customers.push({id,name:nm,phone:String(b.phone||'').trim().slice(0,20),due:0,src:sub._id});
    return {ok:1,kind:'cust',nm,by:sub.byName||''}}
  if(b.kind==='stock'||b.kind==='exp'){const st=UB.staff.find(x=>x._id===sub.by);if(!st||!(b.kind==='stock'?st.canStock===true:st.canExp===true))return {rej:'Not allowed for this staff member'}}
  if(b.kind==='stock'){
    const p=S.products.find(x=>x.id===b.pid);if(!p)return {rej:'Item not found'};
    const q=Math.round(+b.qty);if(!(q>0)||q>100000||!isFinite(q))return {rej:'Bad quantity'};
    const by=sub.byName||'',note=String(b.note||'').trim().slice(0,80);
    p.qty+=q;S.moves.push({id:uid(),ts:sub.ts,pid:p.id,name:p.name,type:'purchase',qty:q,cost:p.cost,note:(note?note+' ':'')+(by?'(by '+by+')':''),by,src:sub._id});
    return {ok:1,kind:'stock',nm:p.name,qty:q,by}}
  if(b.kind==='exp'){
    const a=+b.amount;if(!(a>0)||a>10000000||!isFinite(a))return {rej:'Bad amount'};
    const cat=CATS.indexOf(b.cat)>=0&&b.cat!=='Salary'?b.cat:'Other',by=sub.byName||'',note=String(b.note||'').trim().slice(0,80);
    S.expenses.push({id:uid(),cat,amount:a,note:(note?note+' ':'')+(by?'(by '+by+')':''),by,ts:sub.ts,src:sub._id});
    return {ok:1,kind:'exp',amt:a,cat,by}}
  if(b.kind==='pay'){
    const c=cust(b.cid);if(!c)return {rej:'Customer not found'};
    let a=+b.amount;if(!(a>0)||!isFinite(a))return {rej:'Bad amount'};
    const owe=bal(c.id);if(!(owe>0.5))return {rej:'Customer owes nothing'};
    const capped=a>owe+0.5;a=Math.min(a,owe);
    const m=METHODS.some(x=>x[0]===b.method)?b.method:'cash',lab=(METHODS.find(x=>x[0]===m)||['','Cash'])[1],by=sub.byName||'';
    S.ledger.push({id:uid(),ts:sub.ts,cid:c.id,amount:-a,kind:'payment',method:m,note:'Payment ('+lab+')'+(by?' by '+by:'')+(capped?' - staff entered '+N(+b.amount)+', more than was owed':''),src:sub._id});
    const cc=c;if(bal(c.id)<=0)cc.due=0;
    return {ok:1,kind:'pay',nm:c.name,amt:a,by,capped}}
  const items=Array.isArray(b.items)?b.items:[];
  if(!items.length||items.length>60)return {rej:'No items'};
  let tot=0;
  for(const l of items){if(!(l.qty>0)||!isFinite(l.qty)||!(l.price>=0)||!isFinite(l.price)||!l.name)return {rej:'Bad item'};tot+=l.price*l.qty}
  if(Math.abs(tot-b.total)>0.5)return {rej:'Totals did not match'};
  const paid=+b.paid;if(!(paid>=0)||paid>b.total+0.5)return {rej:'Bad payment'};
  const cid=b.cid||'';
  if(paid<b.total&&!S.customers.some(x=>x.id===cid))return {rej:'Customer not found'};
  const sale={id:uid(),no:++S.seq,ts:sub.ts,items:items.map(l=>{const p=l.pid&&S.products.find(x=>x.id===l.pid);return {pid:p?p.id:'',name:l.name,price:l.price,cost:p?p.cost:0,qty:l.qty}}),total:b.total,paid,method:paid<=0?'credit':(b.method||'cash'),cid,by:sub.byName||'',src:sub._id};
  if(paid<b.total&&cid){const cc=cust(cid);if(cc&&bal(cid)<=0)cc.due=0}
  S.sales.push(sale);
  sale.items.forEach(l=>{if(l.pid){const p=S.products.find(x=>x.id===l.pid);if(p&&!p.nt)p.qty-=l.qty}});
  if(paid<b.total)S.ledger.push({id:uid(),ts:sale.ts,cid,amount:b.total-paid,kind:'sale',saleId:sale.id,note:'Sale #'+sale.no+(sale.by?' (by '+sale.by+')':'')});

function lockPress(d){
  if(!L.mode||L.mode==='forgot')return;
  if((L.mode==='unlock'||L.mode==='check')&&waitLeft()>0){lockDraw();return}
  if(L.buf.length>=4)return;
  L.buf+=d;L.msg='';lockDraw();
  if(L.buf.length===4)setTimeout(lockSubmit,120)}
function lockSubmit(){
  const m=L.mode,p=L.buf;if(!m||p.length!==4)return;
  if(m==='unlock'||m==='check'){
    if(pinOK(p)){setFail({});const a=L.after;lockHide();if(a)a();return}
    const f=failData(),n=(f.n||0)+1,left=5-(n%5||5);
    const o={n,until:0};if(n%5===0)o.until=Date.now()+Math.min(300,30*(n/5))*1000;setFail(o);
    L.buf='';L.msg=o.until?'':'Wrong PIN. '+left+(left===1?' try':' tries')+' left before a wait.';lockDraw();return}
  if(m==='new'){L.tmp=p;L.buf='';L.mode='again';L.msg='';lockDraw();return}
  if(m==='again'){
    if(p===L.tmp){const ok=storePin(p);lockHide();if(ok){setFail({});toast('PIN saved')}else toast('Could not save the PIN');if(ui.sheet)renderSheet();return}
    L.buf='';L.tmp='';L.mode='new';L.msg='The two PINs were different. Start again.';lockDraw()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lk]');if(!b)return;const k=b.dataset.lk;
  if(k==='d')lockPress(b.dataset.v);
  else if(k==='del'){L.buf=L.buf.slice(0,-1);lockDraw()}
  else if(k==='cancel')lockHide();
  else if(k==='forgot')lock('forgot');
  else if(k==='back')lock('unlock');
  else if(k==='erase'){if(!L.sure){L.sure=true;lockDraw();return}
    try{localStorage.removeItem(PINK);localStorage.removeItem(PFK)}catch(er){}
    ui.userCleared=true;S=blank('My Shop','');save();lockHide();ui.sheet=null;render();toast('Records erased and PIN removed')}});
document.addEventListener('keydown',e=>{if(!L.mode)return;if(/^[0-9]$/.test(e.key))lockPress(e.key);else if(e.key==='Backspace'){L.buf=L.buf.slice(0,-1);lockDraw()}});
let awayAt=0;
function lockAway(){if(!awayAt)awayAt=Date.now()}
function lockResume(){const t=awayAt;awayAt=0;if(t&&hasPin()&&!L.mode&&Date.now()-t>30000)lock('unlock')}
window.__away=lockAway;window.__resume=function(){lockResume();syncNow()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)lockAway();else{lockResume();syncNow()}});
A.pinSet=()=>lock('new');
A.pinChange=()=>lock('check',()=>lock('new'));
A.pinRemove=()=>lock('check',()=>{try{localStorage.removeItem(PINK);localStorage.removeItem(PFK)}catch(e){}toast('PIN removed');if(ui.sheet)renderSheet()});
window.__back=function(){if(ui.sheet){close();return true}if(ui.tab!=='home'){A.goto({tab:'home'});return true}return false};
S=load();if(!S)seedSample();
if(hasPin())lock('unlock');
fixDue();
render();
cloudInit();
})();
</script>
